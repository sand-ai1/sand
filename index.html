<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>سند — الدماغ المحلي</title>
<meta name="description" content="تحدث مع سند — الذكاء الاصطناعي المحلي الخاص بك. كل شيء على جهازك.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* =====================================================================
   SAND — local chat · v3 design system
   Palette: near-black surfaces, dark red #c2333d accent. No gold.
   ===================================================================== */
:root{
  --bg:#09090b;--bg-1:#0e0e11;--bg-2:#131317;--bg-3:#19191f;--bg-4:#202027;
  --fg:#ececef;--fg-2:#a9a9b3;--fg-3:#73737e;--fg-4:#4c4c56;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--line-3:rgba(255,255,255,.2);
  --card:rgba(255,255,255,.03);--card-h:rgba(255,255,255,.055);
  --red:#c2333d;--red-h:#d63f4a;--red-d:#8f242d;--red-t:rgba(194,51,61,.11);--red-t2:rgba(194,51,61,.18);
  --red-l:rgba(194,51,61,.38);--red-g:rgba(194,51,61,.3);--red-fg:#f2a7ad;
  --ok:#3fcf8e;--warn:#f0b35a;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:22px;
  --sh-1:0 1px 2px rgba(0,0,0,.45);--sh-2:0 10px 30px -10px rgba(0,0,0,.65);--sh-3:0 30px 80px -20px rgba(0,0,0,.8);
  --ease:cubic-bezier(.2,.7,.2,1);--t:160ms;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","Fira Code",ui-monospace,Consolas,"Courier New",monospace;
  --maxw:780px;--side-w:272px;--head-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--red);color:#fff}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}
:focus-visible{outline:2px solid var(--red-l);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box}

.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(194,51,61,.1),transparent 70%),
             radial-gradient(ellipse 40% 30% at 100% 110%,rgba(194,51,61,.05),transparent 70%)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:0 14px;height:var(--head-h);flex-shrink:0;
  border-bottom:1px solid var(--line);background:rgba(9,9,11,.78);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex-shrink:0;min-width:0}
.brand .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--red-h),var(--red-d));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--red-g),inset 0 1px 0 rgba(255,255,255,.18);flex-shrink:0}
.brand .mark svg{width:19px;height:19px}
.chip{font-size:10.5px;font-weight:600;color:var(--fg-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.hspace{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2);white-space:nowrap;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:#e05555;box-shadow:0 0 0 3px rgba(224,85,85,.18);transition:background var(--t),box-shadow var(--t);flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,207,142,.16)}
.dot.busy{background:var(--red-h);box-shadow:0 0 0 3px rgba(214,63,74,.22);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.selwrap{position:relative;flex-shrink:1;min-width:0}
.sel{appearance:none;-webkit-appearance:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 12px;padding-inline-end:30px;font-size:12.5px;cursor:pointer;outline:none;max-width:220px;width:100%;transition:border-color var(--t),background var(--t);text-overflow:ellipsis}
.sel:hover{background:var(--card-h);border-color:var(--line-2)}
.sel:focus-visible{border-color:var(--red-l)}
.selwrap svg{position:absolute;top:50%;inset-inline-end:10px;width:13px;height:13px;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.ibtn{border:1px solid transparent;color:var(--fg-2);border-radius:var(--r-s);width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;transition:background var(--t),color var(--t),border-color var(--t),transform var(--t)}
.ibtn:hover{color:var(--fg);background:var(--card-h)}
.ibtn:active{transform:scale(.95)}
.ibtn.on{color:var(--red-fg);background:var(--red-t)}
.ibtn.line{border-color:var(--line)}
.ibtn:disabled{opacity:.35;pointer-events:none}
.ibtn svg{width:17px;height:17px}
.ibtn svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tip{position:relative}

/* ---------- layout ---------- */
main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
.side{width:var(--side-w);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg-1);flex-shrink:0;transition:margin var(--t) var(--ease);min-height:0}
.side.hide{margin-inline-start:calc(var(--side-w) * -1)}
.side-back{display:none}
.side-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.newchat{display:flex;align-items:center;gap:9px;width:100%;background:linear-gradient(180deg,var(--red-h),var(--red));color:#fff;border-radius:var(--r-m);padding:10px 12px;font-size:13.5px;font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 18px -6px var(--red-g);transition:filter var(--t),transform var(--t),box-shadow var(--t)}
.newchat:hover{filter:brightness(1.07);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 10px 26px -8px var(--red-g)}
.newchat:active{transform:scale(.985)}
.newchat svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.newchat kbd{margin-inline-start:auto;font-family:var(--mono);font-size:10px;opacity:.75;background:rgba(0,0,0,.22);padding:2px 6px;border-radius:5px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:0 10px;height:36px;transition:border-color var(--t),box-shadow var(--t)}
.search:focus-within{border-color:var(--red-l);box-shadow:0 0 0 3px var(--red-t)}
.search svg{width:14px;height:14px;color:var(--fg-3);flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;background:none;border:none;outline:none;font-size:13px;min-width:0}
.search input::placeholder{color:var(--fg-3)}
.chats{flex:1;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:1px;min-height:0}
.grp{font-size:10.5px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;padding:12px 10px 4px}
.chat-it{padding:8px 10px;border-radius:var(--r-s);color:var(--fg-2);font-size:13.2px;cursor:pointer;transition:background var(--t),color var(--t);display:flex;align-items:center;gap:6px;position:relative;min-height:36px}
.chat-it::before{content:"";position:absolute;inset-inline-start:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--red);opacity:0;transition:opacity var(--t)}
.chat-it:hover{background:var(--card-h);color:var(--fg)}
.chat-it.on{background:var(--red-t);color:var(--fg)}
.chat-it.on::before{opacity:1}
.chat-it .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chat-it .acts{display:flex;gap:2px;opacity:0;transition:opacity var(--t);flex-shrink:0}
.chat-it:hover .acts,.chat-it.on .acts,.chat-it:focus-within .acts{opacity:1}
.chat-it .acts button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);transition:background var(--t),color var(--t)}
.chat-it .acts button:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.chat-it .acts button.del:hover{color:var(--red-fg);background:var(--red-t)}
.chat-it .acts svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-it input.ren{flex:1;min-width:0;background:var(--bg);border:1px solid var(--red-l);border-radius:6px;padding:3px 8px;font-size:13px;outline:none}
.chats .none{color:var(--fg-3);font-size:12.5px;text-align:center;padding:26px 10px}
.side-foot{padding:11px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:8px;line-height:1.5}
.side-foot .dot{width:6px;height:6px;box-shadow:none}

.chatwrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
#feed{flex:1;overflow-y:auto;padding:28px 20px 12px;scroll-behavior:smooth;overscroll-behavior:contain}
.feed-inner{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:30px}

/* ---------- empty state ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(28px,11vh,110px);gap:10px;animation:fadeup .45s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--red-h),var(--red-d));display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 20px 60px -10px var(--red-g),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.empty .logo::after{content:"";position:absolute;inset:-14px;border-radius:32px;border:1px solid var(--red-l);opacity:.35}
.empty .logo svg{width:40px;height:40px}
.empty h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:6px}
.empty p{color:var(--fg-2);font-size:15px;max-width:460px;line-height:1.75}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;width:100%;max-width:640px}
.sg{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;text-align:start;font-size:13px;color:var(--fg-2);display:flex;gap:12px;align-items:flex-start;transition:border-color var(--t),background var(--t),transform var(--t),box-shadow var(--t)}
.sg:hover{border-color:var(--red-l);background:var(--red-t);color:var(--fg);transform:translateY(-2px);box-shadow:var(--sh-2)}
.sg .ic{width:34px;height:34px;border-radius:10px;background:var(--bg-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background var(--t)}
.sg:hover .ic{background:var(--red-t2)}
.sg b{display:block;color:var(--fg);font-size:13.5px;margin-bottom:2px;font-weight:600}
.sg span{display:block;line-height:1.55}

/* ---------- messages ---------- */
.msg{display:flex;flex-direction:column;gap:6px;animation:fadeup .25s var(--ease);position:relative}
.who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--fg)}
.who .av{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:linear-gradient(135deg,var(--red-h),var(--red-d));color:#fff;box-shadow:0 3px 10px -2px var(--red-g),inset 0 1px 0 rgba(255,255,255,.18)}
.who .av svg{width:16px;height:16px}
.who .ts{font-size:11px;color:var(--fg-4);font-weight:400;opacity:0;transition:opacity var(--t)}
.msg:hover .who .ts{opacity:1}
.msg.assistant .body{padding-inline-start:37px;font-size:15.5px;line-height:1.8}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:linear-gradient(180deg,rgba(194,51,61,.17),rgba(194,51,61,.11));border:1px solid var(--red-l);border-radius:var(--r-l);border-end-end-radius:6px;padding:11px 16px;font-size:15.5px;line-height:1.75;max-width:min(80%,620px);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--sh-1)}
.msg.user .macts{justify-content:flex-end}
.edit-box{width:min(100%,620px);display:flex;flex-direction:column;gap:8px}
.edit-box textarea{width:100%;background:var(--bg-2);border:1px solid var(--red-l);border-radius:var(--r-m);padding:12px 14px;font-size:15px;line-height:1.7;outline:none;resize:vertical;min-height:70px;box-shadow:0 0 0 3px var(--red-t)}
.edit-box .row{display:flex;gap:8px;justify-content:flex-end}
.content>:first-child{margin-top:0}.content>:last-child{margin-bottom:0}
.content p{margin:0 0 12px}
.content ul,.content ol{margin:0 0 12px;padding-inline-start:24px}
.content li{margin:3px 0}
.content li>p{margin:0}
.content h2,.content h3,.content h4{font-weight:700;margin:18px 0 8px;line-height:1.4}
.content h2{font-size:18px}.content h3{font-size:16.5px}.content h4{font-size:15.5px}
.content a{color:var(--red-fg);text-decoration:underline;text-decoration-color:var(--red-l);text-underline-offset:3px;transition:text-decoration-color var(--t)}
.content a:hover{text-decoration-color:var(--red-fg)}
.content hr{border:none;border-top:1px solid var(--line-2);margin:16px 0}
.content blockquote{border-inline-start:3px solid var(--red-l);padding:4px 14px;margin:0 0 12px;color:var(--fg-2)}
.content blockquote>:last-child{margin-bottom:0}
.content strong{font-weight:700;color:#fff}
.content em{font-style:italic}
.content del{color:var(--fg-3)}
.tbl{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line-2);border-radius:var(--r-s)}
.content table{border-collapse:collapse;font-size:13.5px;width:100%;min-width:320px}
.content th,.content td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:start;vertical-align:top}
.content th{background:var(--red-t);font-weight:600;color:var(--fg);border-bottom-color:var(--line-2)}
.content tr:last-child td{border-bottom:none}
.content tbody tr:hover td{background:rgba(255,255,255,.02)}
.macts{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity var(--t);min-height:26px}
.msg.assistant .macts{padding-inline-start:33px}
.msg:hover .macts,.msg:focus-within .macts,.macts:focus-within{opacity:1}
@media(hover:none){.macts{opacity:.9}}
.mact{color:var(--fg-3);font-size:11.5px;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;transition:background var(--t),color var(--t)}
.mact:hover{color:var(--fg);background:var(--card-h)}
.mact svg{width:13.5px;height:13.5px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meta{display:flex;gap:10px;font-size:11px;color:var(--fg-4);font-family:var(--mono);margin-inline-start:6px}
.msg.user .macts .ts{font-size:11px;color:var(--fg-4);margin-inline-end:6px}

/* code */
.codeblk{background:#0b0b0e;border:1px solid var(--line-2);border-radius:var(--r-m);margin:0 0 12px;overflow:hidden;direction:ltr;text-align:left;box-shadow:var(--sh-1)}
.codeblk .cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
.codeblk .clang{font-size:11px;color:var(--fg-3);font-family:var(--mono);letter-spacing:.04em}
.codeblk .ccopy{color:var(--fg-3);font-size:11.5px;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;transition:background var(--t),color var(--t)}
.codeblk .ccopy:hover{color:var(--fg);background:var(--card-h)}
.codeblk .ccopy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.codeblk pre{padding:13px 16px;overflow-x:auto;margin:0}
.codeblk code{font-family:var(--mono);font-size:13px;line-height:1.65;color:#e4e4e9;white-space:pre;display:block;background:none;padding:0;border-radius:0}
.content :not(pre)>code{font-family:var(--mono);font-size:.87em;background:var(--red-t);color:var(--red-fg);padding:2px 6px;border-radius:5px;direction:ltr;unicode-bidi:embed}

/* thinking */
.think{border:1px solid var(--line);background:var(--card);border-radius:var(--r-m);margin:0 0 12px;overflow:hidden;transition:border-color var(--t)}
.think:hover{border-color:var(--line-2)}
.think-h{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--fg-2);text-align:start;transition:background var(--t)}
.think-h:hover{background:var(--card-h)}
.think-h svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t) var(--ease);margin-inline-start:auto;flex-shrink:0}
.think.open .think-h svg{transform:rotate(180deg)}
.think.live .think-h .lbl{background:linear-gradient(90deg,var(--fg-3),var(--fg),var(--fg-3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.think-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.think.open .think-b{grid-template-rows:1fr}
.think-b>div{overflow:hidden}
.think-b pre{font-family:inherit;font-size:13px;line-height:1.7;color:var(--fg-2);white-space:pre-wrap;overflow-wrap:anywhere;padding:0 14px 12px;max-height:340px;overflow-y:auto;border-top:1px solid var(--line);padding-top:10px;margin:0}
.typing{display:inline-flex;gap:5px;align-items:center;height:26px;padding:0 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);animation:bounce 1.2s infinite var(--ease)}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.cursor-blink{display:inline-block;width:7px;height:16px;background:var(--red-h);vertical-align:-3px;animation:blink 1s step-end infinite;margin-inline-start:3px;border-radius:2px}
@keyframes blink{50%{opacity:0}}

/* ---------- composer ---------- */
.composer{flex-shrink:0;padding:6px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.comp-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:8px;padding-inline-start:18px;transition:border-color var(--t),box-shadow var(--t),background var(--t);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.04)}
.comp-inner:focus-within{border-color:var(--red-l);box-shadow:0 0 0 4px var(--red-t),var(--sh-2);background:var(--bg-3)}
#input{flex:1;background:none;border:none;outline:none;font-size:15.5px;resize:none;max-height:220px;line-height:1.6;padding:9px 0;min-height:42px}
#input::placeholder{color:var(--fg-3)}
.cbtn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform var(--t),box-shadow var(--t),background var(--t),opacity var(--t)}
.cbtn.send{background:linear-gradient(180deg,var(--red-h),var(--red));color:#fff;box-shadow:0 6px 16px -6px var(--red-g),inset 0 1px 0 rgba(255,255,255,.2)}
.cbtn.send:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px var(--red-g),inset 0 1px 0 rgba(255,255,255,.2)}
.cbtn.send:active{transform:scale(.95)}
.cbtn.send.idle{background:var(--bg-4);color:var(--fg-3);box-shadow:none}
.cbtn.send.idle:hover{transform:none;color:var(--fg-2)}
.cbtn.stop{background:var(--bg-4);border:1px solid var(--red-l);color:var(--red-fg)}
.cbtn.stop:hover{background:var(--red-t2)}
.cbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cbtn.stop svg{fill:currentColor;stroke:none}
.hint{max-width:var(--maxw);margin:8px auto 0;text-align:center;font-size:11px;color:var(--fg-4)}
.hint kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--fg-3)}
.scrollbt{position:absolute;bottom:118px;inset-inline-start:50%;transform:translateX(-50%) translateY(8px);width:34px;height:34px;border-radius:50%;background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg-2);display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity var(--t),transform var(--t),color var(--t),border-color var(--t);box-shadow:var(--sh-2);opacity:0;pointer-events:none}
[dir=rtl] .scrollbt{transform:translateX(50%) translateY(8px)}
.scrollbt.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
[dir=rtl] .scrollbt.show{transform:translateX(50%)}
.scrollbt:hover{color:var(--fg);border-color:var(--line-3)}
.scrollbt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,var(--red-h),var(--red));color:#fff;border-radius:var(--r-m);padding:9px 18px;font-size:13.5px;font-weight:600;transition:filter var(--t),transform var(--t),box-shadow var(--t),background var(--t),color var(--t);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 6px 16px -8px var(--red-g);white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--fg-2);box-shadow:none}
.btn.ghost:hover{color:var(--fg);background:var(--card-h);filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r-s)}

/* ---------- settings modal ---------- */
.sback{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:none;align-items:center;justify-content:center;padding:18px;animation:fade .18s var(--ease)}
.sback.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.set{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);max-width:540px;width:100%;max-height:min(88vh,760px);display:flex;flex-direction:column;animation:pop .22s var(--ease);box-shadow:var(--sh-3)}
.set-h{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.set-h h2{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:10px}
.set-h h2 svg{width:18px;height:18px;stroke:var(--red-h);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-h .sub{color:var(--fg-3);font-size:12px;margin-top:2px}
.set-h .ibtn{margin-inline-start:auto}
.set-b{padding:18px 20px 6px;overflow-y:auto;flex:1;min-height:0}
.fld{margin-bottom:18px}
.fld label.l,.fld .l{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--fg);margin-bottom:7px;font-weight:600}
.fld .l small{font-weight:400;color:var(--fg-3);font-size:11.5px;font-family:var(--mono)}
.fld .help{font-size:11.5px;color:var(--fg-3);margin-top:6px}
.fld textarea,.ep{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-m);font-size:13.5px;padding:11px 13px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
.fld textarea{resize:vertical;min-height:84px;line-height:1.65}
.fld textarea:focus,.ep:focus,.conn-box input:focus{border-color:var(--red-l);box-shadow:0 0 0 3px var(--red-t)}
.rng{display:flex;align-items:center;gap:12px}
.rng input[type=range]{flex:1;accent-color:var(--red);height:4px;cursor:pointer}
.rv{font-family:var(--mono);font-size:12.5px;color:var(--red-fg);min-width:52px;text-align:center;background:var(--red-t);border:1px solid var(--red-l);border-radius:6px;padding:3px 8px}
.ep{font-family:var(--mono);font-size:12.5px;direction:ltr;text-align:left}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);transition:border-color var(--t)}
.sw:hover{border-color:var(--line-2)}
.sw .txt{font-size:13.5px;font-weight:600}
.sw .txt small{display:block;font-weight:400;color:var(--fg-3);font-size:11.5px;margin-top:1px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .knob{width:38px;height:22px;border-radius:999px;background:var(--bg-4);border:1px solid var(--line-2);position:relative;flex-shrink:0;transition:background var(--t),border-color var(--t)}
.sw .knob::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--t) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+.knob{background:var(--red);border-color:var(--red)}
.sw input:checked+.knob::after{transform:translateX(16px)}
[dir=rtl] .sw input:checked+.knob::after{transform:translateX(-16px)}
.sw input:focus-visible+.knob{outline:2px solid var(--red-l);outline-offset:2px}
.set-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.set-f .sp{flex:1}

/* ---------- toast + conn ---------- */
#toast{position:fixed;top:68px;inset-inline-start:50%;transform:translateX(-50%) translateY(-12px);background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:200;transition:transform .22s var(--ease),opacity .22s;opacity:0;pointer-events:none;box-shadow:var(--sh-2);display:flex;align-items:center;gap:8px;white-space:nowrap}
[dir=rtl] #toast{transform:translateX(50%) translateY(-12px)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
[dir=rtl] #toast.show{transform:translateX(50%) translateY(0)}
#toast::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.conn-overlay{position:fixed;inset:0;z-index:100;background:rgba(9,9,11,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px}
.conn-overlay.show{display:flex}
.conn-box{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:30px 28px;max-width:440px;width:100%;text-align:center;animation:pop .25s var(--ease);box-shadow:var(--sh-3)}
.conn-box .em{width:56px;height:56px;border-radius:16px;background:var(--red-t);border:1px solid var(--red-l);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.conn-box .em svg{width:26px;height:26px;stroke:var(--red-fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.conn-box h2{font-size:18px;margin-bottom:6px;font-weight:700}
.conn-box p{color:var(--fg-2);font-size:13.5px;margin-bottom:16px;line-height:1.8}
.conn-box .cmd{direction:ltr;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);padding:8px 8px 8px 14px;border-radius:var(--r-s);margin:0 0 10px;font-family:var(--mono);font-size:12.5px;color:var(--fg-2)}
.conn-box .cmd button{color:var(--fg-3);font-size:11.5px;padding:3px 8px;border-radius:5px;font-family:var(--font)}
.conn-box .cmd button:hover{color:var(--fg);background:var(--card-h)}
.conn-box input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-s);padding:10px 13px;font-family:var(--mono);font-size:12.5px;outline:none;direction:ltr;text-align:left;margin-bottom:12px;transition:border-color var(--t),box-shadow var(--t)}
.conn-box .btn{width:100%}

/* ---------- responsive ---------- */
@media(max-width:860px){
  :root{--side-w:286px}
  .side{position:absolute;inset-inline-start:0;top:0;z-index:60;height:100%;background:var(--bg-1);box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .26s var(--ease);margin:0!important}
  [dir=ltr] .side{transform:translateX(-100%)}
  .side.open{transform:none!important}
  .side-back{display:block;position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .26s}
  .side-back.show{opacity:1;pointer-events:auto}
  #menubtn{display:flex!important}
  header{padding:0 10px;gap:6px}
  .brand .chip{display:none}
  .status{padding:5px 7px;background:none;border:none}
  .status #status-txt{display:none}
  .sel{max-width:132px;font-size:12px}
  #feed{padding:18px 14px 8px}
  .feed-inner{gap:24px}
  .msg.user .bubble{max-width:92%;font-size:15px}
  .msg.assistant .body{padding-inline-start:0;font-size:15px}
  .msg.assistant .macts{padding-inline-start:0}
  .sugg{grid-template-columns:1fr;gap:8px;margin-top:18px}
  .empty h1{font-size:22px}
  .empty p{font-size:14px}
  .composer{padding:4px 10px calc(10px + env(safe-area-inset-bottom))}
  .comp-inner{border-radius:20px;padding:6px;padding-inline-start:14px}
  #input{font-size:16px}
  .hint{display:none}
  .scrollbt{bottom:92px}
  .set{max-height:100%;border-radius:var(--r-l)}
  .sback{padding:10px}
}
@media(max-width:480px){.brand>span:not(.mark){display:none}.sel{max-width:118px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ambient"></div>
<div id="app">
<header>
  <button class="ibtn" onclick="toggleSide()" id="menubtn" data-i18n-title="chats" style="display:none" aria-label="القائمة">

  <div class="hspace"></div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="status-txt">جاري الاتصال…</span></div>
  <div class="selwrap"><select class="sel" id="model" data-i18n-title="model" aria-label="النموذج"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  <button class="ibtn" id="exportbtn" onclick="exportChat()" data-i18n-title="export" aria-label="تصدير">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></button>
  <button class="ibtn" onclick="openSettings()" data-i18n-title="settings" aria-label="الإعدادات">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
  <button class="ibtn line" onclick="toggleLang()" id="langbtn" title="English">EN</button>
</header>
<main>
<aside class="side" id="side">

  </div>

</aside>

</div>

<div class="sback" id="sback" onclick="if(event.target===this)closeSettings()">
  <div class="set" role="dialog" aria-modal="true" aria-labelledby="set-title">

    </div>

<script>
/* ============ SAND local chat v3 ============ */
let AR = document.documentElement.lang === "ar";
const $ = id => document.getElementById(id);

const SYS_DEFAULT = "أنت سند — الذكاء الاصطناعي الشخصي لعساف. صريح، محترف، بلا رفض على ما يملكه عساف (اختراق أمني لسيرفراته، تداول، تجارة). تجاوب بالعربية إذا سُئلت بالعربية وبالإنجليزية للكود. عمق ومصداقية دائمًا.";
const CFG_DEFAULT = { sys: SYS_DEFAULT, temp: 0.7, ctx: 8192, showThink: true, ep: "http://localhost:11434" };
let CFG = Object.assign({}, CFG_DEFAULT, JSON.parse(localStorage.getItem("sand-cfg") || "null") || {});
let EP = CFG.ep;

const T = {
  ph: ["اكتب لسند…", "Message SAND…"],
  hint: ["<kbd>Enter</kbd> للإرسال · <kbd>Shift</kbd>+<kbd>Enter</kbd> سطر جديد · كل شيء محلي على جهازك", "<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · everything stays on your machine"],
  you: ["عساف", "You"], sand: ["سند", "SAND"], chip: ["محلي", "local"],
  ok: ["متصل", "Connected"], bad: ["غير متصل", "Offline"], connecting: ["جاري الاتصال…", "Connecting…"],
  newchat: ["محادثة جديدة", "New chat"], chats: ["المحادثات", "Chats"],
  search: ["بحث في المحادثات…", "Search chats…"], "no-results": ["لا توجد نتائج", "No results"],
  today: ["اليوم", "Today"], yesterday: ["أمس", "Yesterday"], week: ["آخر 7 أيام", "Previous 7 days"], older: ["أقدم", "Older"],
  "empty-h": ["سند جاهز — دماغك على جهازك", "SAND is ready — your brain, your machine"],
  "empty-p": ["اسأله عن الأمن والتداول والبرمجة والتصميم — بالعربي أو الإنجليزي. كل شيء يبقى محليًا.", "Ask about security, trading, code, design — Arabic or English. Everything stays local."],
  copy: ["نسخ", "Copy"], copied: ["تم النسخ", "Copied"],
  regen: ["إعادة توليد", "Regenerate"], edit: ["تعديل", "Edit"], export: ["تصدير المحادثة", "Export chat"],
  exported: ["تم تصدير المحادثة", "Chat exported"], nothing: ["لا يوجد شيء للتصدير", "Nothing to export"],
  rename: ["إعادة تسمية", "Rename"], delete: ["حذف", "Delete"],
  "confirm-del": ["حذف هذه المحادثة نهائيًا؟", "Delete this chat permanently?"],
  send: ["إرسال", "Send"], stop: ["إيقاف", "Stop"], stopped: ["تم الإيقاف", "Stopped"],
  save: ["حفظ", "Save"], saved: ["تم الحفظ", "Saved"], cancel: ["إلغاء", "Cancel"], close: ["إغلاق", "Close"],
  reset: ["استعادة الافتراضي", "Reset defaults"], resent: ["أُعيد الإرسال", "Resent"],
  settings: ["الإعدادات", "Settings"], "set-sub": ["كل الإعدادات محفوظة على جهازك فقط", "All settings are stored on your device only"],
  "s-sys": ["شخصية سند", "SAND persona"], "s-temp": ["الإبداع", "Creativity"], "s-ctx": ["حجم السياق", "Context size"],

const t = k => (T[k] ? T[k][AR ? 0 : 1] : k);

let chats = JSON.parse(localStorage.getItem("sand-chats") || "[]");

let models = [];
let busy = false, aborter = null, editing = null;

function saveAll(){

}
function getChat(){
  let c = chats.find(x => x.id === cur);

}
function chatTitle(c){ return c.title || t("newchat"); }
function chatTime(c){ return c.up || parseInt(c.id.slice(1)) || 0; }

/* ---------- i18n ---------- */
function applyLang(){

function toggleLang(){ AR = !AR; localStorage.setItem("sand-lang", AR ? "ar" : "en"); applyLang(); renderChats(); renderFeed(); }

/* ---------- chats list ---------- */
function renderChats(){
  const q = ($("srch").value || "").trim().toLowerCase();
  const el = $("chats"); el.innerHTML = "";
  const list = chats.filter(c => !q || chatTitle(c).toLowerCase().includes(q) || c.msgs.some(m => m.content.toLowerCase().includes(q)))
                    .slice().sort((a, b) => chatTime(b) - chatTime(a));
  if(!list.length){ const n = document.createElement("div"); n.className = "none"; n.textContent = q ? t("no-results") : ""; el.appendChild(n); return; }
  const now = new Date(); const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const grpOf = ts => ts >= d0 ? "today" : ts >= d0 - 864e5 ? "yesterday" : ts >= d0 - 6 * 864e5 ? "week" : "older";
  let lastG = null;
  list.forEach(c => {
    const g = grpOf(chatTime(c));
    if(g !== lastG){ const h = document.createElement("div"); h.className = "grp"; h.textContent = t(g); el.appendChild(h); lastG = g; }
    const d = document.createElement("div");

    const acts = document.createElement("span"); acts.className = "acts";
    const rn = document.createElement("button"); rn.title = t("rename"); rn.setAttribute("aria-label", t("rename"));
    rn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
    rn.onclick = e => { e.stopPropagation(); renameChat(c, d, ts); };
    const x = document.createElement("button"); x.className = "del"; x.title = t("delete"); x.setAttribute("aria-label", t("delete"));
    x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    x.onclick = e => { e.stopPropagation();
      if(c.msgs.length && !confirm(t("confirm-del"))) return;
      if(busy && c.id === cur) stopGen();

      if(cur === c.id) cur = chats[0] ? chats[0].id : null;

    acts.appendChild(rn); acts.appendChild(x);

function renameChat(c, row, ts){
  if(row.querySelector(".ren")) return;
  const inp = document.createElement("input"); inp.className = "ren"; inp.value = chatTitle(c); inp.maxLength = 60;

  const finish = ok => { if(done) return; done = true; if(ok && inp.value.trim()) c.title = inp.value.trim().slice(0, 60); saveAll(); renderChats(); };
  inp.onkeydown = e => { e.stopPropagation(); if(e.key === "Enter") finish(true); if(e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
  row.replaceChild(inp, ts); inp.focus(); inp.select();

/* ---------- markdown ---------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
function codeHtml(b){
  return '<div class="codeblk"><div class="cbar"><span class="clang">' + esc(b.l) + '</span><button class="ccopy" onclick="cpCode(this)">' + ICON_COPY + '<span>' + t("copy") + '</span></button></div><pre><code>' + b.c + '</code></pre></div>';
}
function inline(s){
  return s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[\s(،])\*([^*\n]+)\*(?=[\s).,،;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const blocks = [];
  let s = esc(src).replace(/```([\w+-]*)[^\n]*\n?([\s\S]*?)(?:```|$)/g, (m, l, c) => {
    blocks.push({l: l || "code", c: c.replace(/\n$/, "")});
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  const lines = s.split("\n"); let out = "", i = 0, m;
  const isBlank = l => /^\s*$/.test(l);
  const startsBlock = l => /^(#{1,6}\s|\s*[-*+]\s+|\s*\d+[.)]\s+|\s*&gt;|\s*\|)/.test(l) || /^\s*(---|\*\*\*|___)\s*$/.test(l) || /^\u0000\d+\u0000\s*$/.test(l);
  while(i < lines.length){
    const L = lines[i];
    if(isBlank(L)){ i++; continue; }
    if((m = L.match(/^\u0000(\d+)\u0000\s*$/))){ out += codeHtml(blocks[+m[1]]); i++; continue; }
    if((m = L.match(/^(#{1,6})\s+(.*)$/))){ const lv = Math.min(m[1].length + 1, 4); out += "<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"; i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(L)){ out += "<hr>"; i++; continue; }
    if(/^\s*&gt;/.test(L)){ const q = []; while(i < lines.length && /^\s*&gt;/.test(lines[i])){ q.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++; } out += "<blockquote>" + mdLines(q) + "</blockquote>"; continue; }
    if(/^\s*\|/.test(L) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])){
      const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(x => inline(x.trim()));
      const head = cells(L); i += 2; let rows = "";
      while(i < lines.length && /^\s*\|/.test(lines[i])){ rows += "<tr>" + cells(lines[i]).map(x => "<td>" + x + "</td>").join("") + "</tr>"; i++; }
      out += '<div class="tbl"><table><thead><tr>' + head.map(x => "<th>" + x + "</th>").join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div>"; continue;
    }
    if(/^\s*[-*+]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L)){
      const ol = /^\s*\d+[.)]\s+/.test(L); const re = ol ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/; let items = "";
      while(i < lines.length && re.test(lines[i])){
        let item = lines[i].replace(re, ""); i++;
        while(i < lines.length && !isBlank(lines[i]) && !startsBlock(lines[i])){ item += "<br>" + lines[i]; i++; }
        items += "<li>" + inline(item) + "</li>";
      }
      out += (ol ? "<ol>" : "<ul>") + items + (ol ? "</ol>" : "</ul>"); continue;
    }
    let p = [L]; i++;
    while(i < lines.length && !isBlank(lines[i]) && !startsBlock(lines[i])){ p.push(lines[i]); i++; }
    out += "<p>" + inline(p.join("<br>")).replace(/\u0000(\d+)\u0000/g, (m, j) => "</p>" + codeHtml(blocks[+j]) + "<p>") + "</p>";
  }
  return out.replace(/<p><\/p>/g, "");
}
function mdLines(arr){ return md(arr.join("\n").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")); }
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => {});
  else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); }
}
function cpCode(b){
  copyText(b.closest(".codeblk").querySelector("code").textContent);
  const s = b.querySelector("span"); s.textContent = t("copied"); setTimeout(() => s.textContent = t("copy"), 1400);
}
let toastT;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800);
}
</script>
<script>
/* ---------- rendering ---------- */
const AV_SAND = '<svg viewBox="0 0 32 32" fill="none"><path d="M4 24c6-2 8-10 14-10 4 0 6 2 10 2-4 4-8 8-14 8-4 0-7 0-10 0Z" fill="#fff"/><circle cx="21" cy="10" r="2.5" fill="#0d0d10"/></svg>';
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString(AR ? "ar-u-nu-latn" : "en", {hour: "2-digit", minute: "2-digit"}) : "";
function splitThink(s){
  const m = s.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if(!m) return {think: "", vis: s, live: false};
  return {think: m[1].trim(), vis: s.slice(m[0].length), live: !m[2]};
}
function stripThink(s){ return splitThink(s).vis.trim(); }
function thinkBox(text, live, open){
  const d = document.createElement("div");
  d.className = "think" + (live ? " live" : "") + (open ? " open" : "");
  d.innerHTML = '<button class="think-h" type="button"><span class="lbl">' + (live ? t("thinking") : "💭 " + t("thought")) + '</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="think-b"><div><pre></pre></div></div>';
  d.querySelector("pre").textContent = text;
  d.querySelector(".think-h").onclick = () => d.classList.toggle("open");
  return d;
}
function metaEl(m){
  if(!m.tps && !m.secs) return null;
  const meta = document.createElement("span"); meta.className = "meta";
  meta.innerHTML = (m.tps ? "<span>" + m.tps + " " + t("speed") + "</span>" : "") + (m.secs ? "<span>" + m.secs + "s</span>" : "");
  return meta;
}
function bubble(m, streaming){
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "user" ? "user" : "assistant");
  if(m.role === "user"){
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content;
    d.appendChild(b);
    const acts = document.createElement("div"); acts.className = "macts";
    const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = fmtTime(m.ts); acts.appendChild(ts);
    acts.appendChild(act(t("copy"), ICON_COPY, () => { copyText(m.content); toast(t("copied")); }));
    acts.appendChild(act(t("edit"), '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>', () => editMsg(m, d)));
    d.appendChild(acts);
    return d;
  }
  const who = document.createElement("div"); who.className = "who";
  who.innerHTML = '<span class="av">' + AV_SAND + '</span><span>' + t("sand") + '</span><span class="ts">' + fmtTime(m.ts) + '</span>';
  const body = document.createElement("div"); body.className = "body";
  const {think, vis, live} = splitThink(m.content);
  if(CFG.showThink && think) body.appendChild(thinkBox(think, streaming && live, false));
  const content = document.createElement("div"); content.className = "content";
  if(streaming && !vis.trim()) content.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else content.innerHTML = md(vis) + (streaming ? '<span class="cursor-blink"></span>' : "");
  body.appendChild(content);
  d.appendChild(who); d.appendChild(body);
  if(!streaming){
    const acts = document.createElement("div"); acts.className = "macts";
    acts.appendChild(act(t("copy"), ICON_COPY, () => { copyText(stripThink(m.content)); toast(t("copied")); }));
    acts.appendChild(act(t("regen"), '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0115.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 01-15.5 6.3L3 16M3 21v-5h5"/></svg>', () => regen(m)));
    const me = metaEl(m); if(me) acts.appendChild(me);
    d.appendChild(acts);
  }
  return d;
}
function act(label, svg, fn){
  const b = document.createElement("button"); b.className = "mact"; b.type = "button";
  b.innerHTML = svg + "<span>" + label + "</span>"; b.onclick = fn; b.title = label;
  return b;
}
function renderFeed(){
  const inner = $("feed-inner"); inner.innerHTML = ""; editing = null;
  const c = getChat();
  $("exportbtn").disabled = !c.msgs.length;
  if(c.msgs.length === 0){
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = '<div class="logo">' + AV_SAND + '</div><h1>' + t("empty-h") + "</h1><p>" + t("empty-p") + "</p>" +
      '<div class="sugg">' +
      sg("🛡️", AR ? "فحص أمني" : "Security audit", AR ? "اكتب لي سكربت فحص ثغرات لمواقعي" : "Write a vuln scanner for my sites") +
      sg("📈", AR ? "تحليل تداول" : "Trading analysis", AR ? "حلل وضع BTC الحالي وهل أدخل" : "Analyze BTC — should I enter?") +
      sg("💻", AR ? "برمجة" : "Code", AR ? "ابنِ لي API كامل مع مصادقة JWT" : "Build me a full API with JWT auth") +
      sg("🎨", AR ? "تصميم" : "Design", AR ? "صمم لي صفحة هبوط احترافية" : "Design a pro landing page") +
      "</div>";
    inner.appendChild(e); return;
  }
  c.msgs.forEach(m => inner.appendChild(bubble(m, false)));
  requestAnimationFrame(() => { $("feed").scrollTop = $("feed").scrollHeight; });
}
function sg(icon, title, text){
  return '<button class="sg" type="button" data-sg="' + esc(text).replace(/"/g, "&quot;") + '"><span class="ic">' + icon + '</span><span><b>' + title + "</b><span>" + text + "</span></span></button>";
}
document.addEventListener("click", e => {
  const s = e.target.closest(".sg");
  if(s){ $("input").value = s.dataset.sg; send(); }
});

/* ---------- models ---------- */
async function loadModels(){
  $("status-txt").textContent = t("connecting");
  try{
    const r = await fetch(EP + "/v1/models");
    const j = await r.json();
    let all = j.data.map(m => m.id);
    models = all.filter(m => m.toLowerCase().includes("sand"));
    if(!models.length) models = all;
    const sel = $("model");
    const prev = localStorage.getItem("sand-model") || "sand:latest";
    sel.innerHTML = models.map(m => '<option value="' + esc(m) + '"' + (m === prev ? " selected" : "") + ">" + esc(m.replace(/:latest$/, "")) + "</option>").join("");
    if(!sel.value && models[0]) sel.value = models[0];
    sel.onchange = () => localStorage.setItem("sand-model", sel.value);
    $("dot").className = busy ? "dot busy" : "dot ok";
    $("status-txt").textContent = t("ok");
    $("conn").classList.remove("show");
    return true;
  }catch(e){
    $("dot").className = "dot";
    $("status-txt").textContent = t("bad");
    $("conn-url").value = EP;
    $("conn").classList.add("show");
    return false;
  }
}

/* ---------- send / stream ---------- */
function setBusy(v){
  busy = v;
  $("sendbtn").style.display = v ? "none" : "flex";
  $("stopbtn").style.display = v ? "flex" : "none";
  $("dot").className = v ? "dot busy" : "dot ok";
  $("input").disabled = false;
}
function stopGen(){ if(aborter) aborter.abort(); }

async function send(textOverride){
  const inp = $("input");
  const text = (textOverride !== undefined ? textOverride : inp.value).trim();
  if(!text || busy) return;
  if(editing) editing.cancel();
  setBusy(true);
  inp.value = ""; inp.style.height = "auto"; updateSendState();
  const c = getChat();
  c.msgs.push({role: "user", content: text, ts: Date.now()});
  c.up = Date.now();
  if(c.msgs.length === 1){ c.title = text.replace(/\s+/g, " ").slice(0, 44); }
  renderChats();
  const inner = $("feed-inner");
  if(c.msgs.length === 1) inner.innerHTML = "";
  inner.appendChild(bubble(c.msgs[c.msgs.length - 1], false));
  $("exportbtn").disabled = false;
  await stream(c, inner);
}

async function stream(c, inner){
  if(busy && aborter) return;
  setBusy(true);
  const a = {role: "assistant", content: "", ts: Date.now()};
  c.msgs.push(a);
  const el = bubble(a, true);
  inner.appendChild(el);
  const body = el.querySelector(".body");
  let content = el.querySelector(".content"), thinkEl = null;
  scrollFeed(true);
  const t0 = performance.now();
  let ntok = 0, thinkOpen = false, raf = 0;
  const paint = () => {
    raf = 0;
    const {think, vis, live} = splitThink(a.content);
    if(CFG.showThink && think){
      if(!thinkEl){ thinkEl = thinkBox(think, live, false); body.insertBefore(thinkEl, content); }
      else {
        const pre = thinkEl.querySelector("pre"); pre.textContent = think; pre.scrollTop = pre.scrollHeight;
        thinkEl.classList.toggle("live", live);
        thinkEl.querySelector(".lbl").textContent = live ? t("thinking") : "💭 " + t("thought");
      }
    }
    if(vis.trim()) content.innerHTML = md(vis) + '<span class="cursor-blink"></span>';
    scrollFeed();
  };
  const schedule = () => { if(!raf) raf = requestAnimationFrame(paint); };
  aborter = new AbortController();
  try{
    const hist = [{role: "system", content: CFG.sys}];
    c.msgs.slice(0, -1).forEach(m => hist.push({role: m.role, content: stripThink(m.content)}));
    const r = await fetch(EP + "/v1/chat/completions", {
      method: "POST", signal: aborter.signal,
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ model: $("model").value || models[0], messages: hist, stream: true, temperature: CFG.temp, options: {num_ctx: CFG.ctx} })
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith("data: ")) continue;
        const payload = line.slice(6).trim();
        if(payload === "[DONE]") continue;
        try{
          const j = JSON.parse(payload);
          const delta = j.choices[0].delta || {};
          const reason = delta.reasoning || delta.reasoning_content || "";
          const d = delta.content || "";
          if(reason){ if(!thinkOpen){ a.content += "<think>"; thinkOpen = true; } a.content += reason; ntok++; }
          if(d){ if(thinkOpen){ a.content += "</think>"; thinkOpen = false; } a.content += d; ntok++; }
          if(reason || d) schedule();
        }catch(e){}
      }
    }
    if(thinkOpen){ a.content += "</think>"; thinkOpen = false; }
  }catch(e){
    if(thinkOpen){ a.content += "</think>"; thinkOpen = false; }
    if(e.name === "AbortError"){ if(!stripThink(a.content)) a.content = "⏹ " + t("stopped"); }
    else{ a.content = t("discon"); $("conn").classList.add("show"); }
  }
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  const secs = Math.max((performance.now() - t0) / 1000, 0.1);
  a.tps = Math.round(ntok / secs); a.secs = +secs.toFixed(1);
  if(a.content === "⏹ " + t("stopped")){ a.tps = 0; a.secs = 0; }
  el.replaceWith(bubble(a, false));
  scrollFeed();
  saveAll();
  setBusy(false); aborter = null;
  renderChats();
  if(innerWidth > 860) $("input").focus();
}

function regen(m){
  const c = getChat();
  const i = c.msgs.indexOf(m);
  if(i < 0 || busy) return;
  c.msgs.splice(i); saveAll();
  renderFeed();
  stream(c, $("feed-inner"));
}
function editMsg(m, row){
  const c = getChat();
  const i = c.msgs.indexOf(m);
  if(i < 0 || busy) return;
  if(editing) editing.cancel();
  const box = document.createElement("div"); box.className = "edit-box";
  const ta = document.createElement("textarea"); ta.value = m.content;
  const r = document.createElement("div"); r.className = "row";
  const cancel = document.createElement("button"); cancel.className = "btn ghost sm"; cancel.textContent = t("cancel");
  const ok = document.createElement("button"); ok.className = "btn sm"; ok.textContent = t("send");
  r.appendChild(cancel); r.appendChild(ok); box.appendChild(ta); box.appendChild(r);
  const orig = Array.from(row.children);
  row.innerHTML = ""; row.appendChild(box);
  const restore = () => { row.innerHTML = ""; orig.forEach(x => row.appendChild(x)); editing = null; };
  editing = {cancel: restore};
  cancel.onclick = restore;
  ok.onclick = () => {
    const val = ta.value.trim(); if(!val) return;
    editing = null; c.msgs.splice(i); saveAll(); renderFeed(); send(val);
  };
  ta.onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ok.onclick(); } if(e.key === "Escape") restore(); };
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.style.height = Math.min(ta.scrollHeight + 2, 320) + "px";
}
function scrollFeed(force){
  const f = $("feed");
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 160;
  if(near || force) f.scrollTop = f.scrollHeight;
  $("scrollbt").classList.toggle("show", !near && !force);
}
</script>
<script>
/* ---------- settings / misc / init ---------- */
function fillSettings(cfg){
  $("s-sys").value = cfg.sys;
  $("s-temp").value = cfg.temp; $("s-tempv").textContent = cfg.temp;
  $("s-ctx").value = cfg.ctx;   $("s-ctxv").textContent = cfg.ctx;
  $("s-think").checked = cfg.showThink;
  $("s-ep").value = cfg.ep;
}
function openSettings(){ fillSettings(CFG); $("sback").classList.add("show"); setTimeout(() => $("s-sys").focus(), 50); }
function closeSettings(){ $("sback").classList.remove("show"); }
function resetSettings(){ fillSettings(CFG_DEFAULT); }
function saveSettings(){
  const prevThink = CFG.showThink;
  CFG.sys = $("s-sys").value.trim() || SYS_DEFAULT;
  CFG.temp = parseFloat($("s-temp").value);
  CFG.ctx = parseInt($("s-ctx").value);
  CFG.showThink = $("s-think").checked;
  const newEp = $("s-ep").value.trim().replace(/\/+$/, "") || CFG_DEFAULT.ep;
  if(newEp !== CFG.ep){ CFG.ep = newEp; EP = newEp; loadModels(); }
  saveAll(); closeSettings();
  if(prevThink !== CFG.showThink) renderFeed();
  toast(t("saved"));
}
async function reconnect(){
  const b = $("conn-btn"); b.disabled = true; b.textContent = t("retrying");
  EP = $("conn-url").value.trim().replace(/\/+$/, "") || CFG_DEFAULT.ep;
  CFG.ep = EP; saveAll();
  await loadModels();
  b.disabled = false; b.textContent = t("retry");
}
function newChat(){
  const c = chats.find(x => x.id === cur);
  if(!(c && c.msgs.length === 0)){ cur = null; getChat(); saveAll(); }
  renderChats(); renderFeed();
  closeSideMobile();
  $("input").focus();
}
function isMobile(){ return innerWidth <= 860; }
function toggleSide(){
  if(isMobile()){ const o = $("side").classList.toggle("open"); $("sideback").classList.toggle("show", o); }
  else $("side").classList.toggle("hide");
}
function closeSideMobile(){ if(isMobile()){ $("side").classList.remove("open"); $("sideback").classList.remove("show"); } }
function exportChat(){
  const c = getChat();
  if(!c.msgs.length){ toast(t("nothing")); return; }
  let out = "# " + chatTitle(c) + "\n\n";
  c.msgs.forEach(m => { out += "**" + (m.role === "user" ? t("you") : t("sand")) + ":**\n\n" + stripThink(m.content) + "\n\n---\n\n"; });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type: "text/markdown;charset=utf-8"}));
  a.download = "sand-" + (chatTitle(c).replace(/[^\w؀-ۿ ]/g, "").trim().slice(0, 24) || "chat") + ".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t("exported"));
}

/* ---------- keyboard ---------- */
const inp = $("input");
function updateSendState(){ $("sendbtn").classList.toggle("idle", !inp.value.trim()); }
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 220) + "px"; updateSendState(); });
inp.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeSettings(); closeSideMobile(); if(editing) editing.cancel(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); newChat(); }
});
$("feed").addEventListener("scroll", () => {
  const f = $("feed");
  $("scrollbt").classList.toggle("show", f.scrollHeight - f.scrollTop - f.clientHeight > 300);
});
addEventListener("resize", () => { if(!isMobile()){ $("side").classList.remove("open"); $("sideback").classList.remove("show"); } });

/* ---------- init ---------- */
if(localStorage.getItem("sand-lang") === "en") AR = false;
chats = chats.filter(c => c.msgs.length || c.id === cur);
if(isMobile()) $("menubtn").style.display = "flex";
getChat();
applyLang();
renderChats();
renderFeed();
updateSendState();
loadModels();
</script>
</body>
</html>
